name: linux-system-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cross-check:
    name: aarch64 compile check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Add aarch64 target
        run: rustup target add aarch64-unknown-linux-gnu
      - name: Check userspace for aarch64
        env:
          AYA_BUILD_SKIP: "1"
        run: cargo check -p aya-app --target aarch64-unknown-linux-gnu

  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Ubuntu 22.04
          - os: ubuntu-24.04
            name: Ubuntu 24.04
    steps:
      - uses: actions/checkout@v7

      - name: Show distribution and kernel
        run: |
          cat /etc/os-release
          uname -a

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Use stable as default
        run: rustup default stable
      - name: Add Linux target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Install bpf-linker (static prebuilt)
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          curl -L --fail -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.13.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          zstd -d -f /tmp/bpf-linker.tar.zst -o /tmp/bpf-linker.tar
          mkdir -p "$HOME/.local/bin"
          tar -xf /tmp/bpf-linker.tar -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/bpf-linker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Linux tests
        run: FULL_BUILD=1 bash scripts/test-linux.sh
